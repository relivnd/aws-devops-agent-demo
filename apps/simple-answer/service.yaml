apiVersion: v1
kind: Service
metadata:
  name: simple-answer
  namespace: simple-answer
  labels:
    app.kubernetes.io/name: simple-answer
  annotations:
    # Internet-facing NLB, placed in the VPC public subnets (already tagged
    # kubernetes.io/role/elb=1). The app has no authentication, so anything
    # reachable here is public — see load-balancer-source-ranges below if you
    # want to restrict it to known client IPs.
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    # service.beta.kubernetes.io/load-balancer-source-ranges: "203.0.113.4/32"
spec:
  # Required on EKS Auto Mode: the built-in load balancing capability only
  # reconciles Services with this class. A plain `type: LoadBalancer` without it
  # stays in <pending>.
  loadBalancerClass: eks.amazonaws.com/nlb
  type: LoadBalancer
  selector:
    app: simple-answer
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
