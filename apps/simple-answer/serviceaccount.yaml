# The name and namespace of this ServiceAccount must match the
# aws_eks_pod_identity_association in infra/simple_answer.tf. Pod Identity
# needs no IAM annotations on the ServiceAccount (unlike IRSA) — the mapping
# lives entirely on the AWS side.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: simple-answer
  namespace: simple-answer
  labels:
    app.kubernetes.io/name: simple-answer
