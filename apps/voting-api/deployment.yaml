apiVersion: apps/v1
kind: Deployment
metadata:
  name: voting-api
  namespace: voting-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: voting-api
  template:
    metadata:
      labels:
        app: voting-api
    spec:
      containers:
        - name: voting-api
          image: 209479284687.dkr.ecr.eu-central-1.amazonaws.com/demo-app:v1
          ports:
            - containerPort: 8000
          env:
            - name: APP_CONFIG_PATH
              value: /config/settings.conf
          volumeMounts:
            - name: config
              mountPath: /config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: voting-api-config
