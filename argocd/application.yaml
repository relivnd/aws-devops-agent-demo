apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: simple-answer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/relivnd/aws-devops-agent-demo.git
    targetRevision: main
    path: apps/simple-answer
  destination:
    server: arn:aws:eks:eu-central-1:209479284687:cluster/copebit-eks-cluster-s00nrj
    namespace: simple-answer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
