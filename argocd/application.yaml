apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: voting-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/relivnd/CNZ-2026-Demo.git
    targetRevision: main
    path: apps/voting-api
  destination:
    server: https://kubernetes.default.svc
    namespace: voting-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
